# ==============================================================================
# clipsai — Infraestructura unificada (Issue 1 + Orquestación completa)
# ------------------------------------------------------------------------------
# Levanta los 6 servicios con un solo comando:
#   docker compose up -d --build
#
# Servicios:
#   - db                : postgres:15-alpine  :5432
#   - backend_fastapi   : FastAPI  :8000  (health /health)
#   - backend_express   : Express  :3001  (health /health)
#   - frontend_react    : React + Vite  :3000  (hot-reload)
#   - frontend_vue      : Vue + Vite    :5173  (hot-reload)
#   - ngrok             : túnel a backend_fastapi:8000 --domain decorador
#
# Uso:
#   cp .env.example .env  # completar JWT_SECRET, GOOGLE_*, NGROK_AUTHTOKEN
#   docker compose up -d --build
#   docker compose logs -f            # todos
#   docker compose logs -f backend_fastapi frontend_react ngrok
#   docker compose ps                 # 6 healthy
#   docker compose down               # mantiene postgres_data
#   docker compose down -v            # borra DB (cuidado)
#   ngrok inspect -> http://localhost:4040
# ==============================================================================

services:
  db:
    image: postgres:15-alpine
    container_name: clipsai-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGTZ: ${POSTGRES_TZ:-UTC}
      TZ: ${POSTGRES_TZ:-UTC}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - clipsai-net

  # ----------------------------------------------------------------------------
  # Backend FastAPI (Issue 3)
  # ----------------------------------------------------------------------------
  backend_fastapi:
    build:
      context: ./backend_fastapi
      dockerfile: Dockerfile
    container_name: clipsai-backend-fastapi
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      APP_ENV: ${APP_ENV:-development}
      TZ: ${POSTGRES_TZ:-UTC}
    ports:
      - "${BACKEND_FASTAPI_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - clipsai-net

  backend_express:
    build:
      context: ./backend_express
      dockerfile: Dockerfile
    container_name: clipsai-backend-express
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      APP_ENV: ${APP_ENV:-development}
      PORT: ${BACKEND_EXPRESS_PORT:-3001}
      BACKEND_EXPRESS_PORT: ${BACKEND_EXPRESS_PORT:-3001}
      TZ: ${POSTGRES_TZ:-UTC}
    ports:
      - "${BACKEND_EXPRESS_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\" || wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - clipsai-net

  # ----------------------------------------------------------------------------
  # Frontends — desarrollo con hot-reload (Vite)
  # ----------------------------------------------------------------------------
  frontend_react:
    image: node:20-alpine
    container_name: clipsai-frontend-react
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    env_file:
      - .env
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend_react:/app
      - /app/node_modules
    depends_on:
      backend_fastapi:
        condition: service_healthy
    networks:
      - clipsai-net

  frontend_vue:
    image: node:20-alpine
    container_name: clipsai-frontend-vue
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    env_file:
      - .env
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend_vue:/app
      - /app/node_modules
    depends_on:
      backend_fastapi:
        condition: service_healthy
    networks:
      - clipsai-net

  # ----------------------------------------------------------------------------
  # Ngrok — túnel a backend_fastapi:8000
  # ----------------------------------------------------------------------------
  ngrok:
    image: ngrok/ngrok:latest
    container_name: clipsai-ngrok
    command: http backend_fastapi:8000 --domain=${NGROK_DOMAIN:-decorator-excretory-satin.ngrok-free.dev}
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    depends_on:
      backend_fastapi:
        condition: service_healthy
    ports:
      - "4040:4040"
    networks:
      - clipsai-net
    restart: unless-stopped

volumes:
  postgres_data:
    name: clipsai_postgres_data

networks:
  clipsai-net:
    name: clipsai-net
    driver: bridge
