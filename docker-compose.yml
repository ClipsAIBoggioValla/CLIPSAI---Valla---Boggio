# ==============================================================================
# clipsai — Infraestructura base (Issue 1)
# ------------------------------------------------------------------------------
# Levanta PostgreSQL 15 con:
#   - Persistencia via volumen nombrado (postgres_data)
#   - Scripts DDL de inicializacion en ./init-scripts/
#   - Healthcheck con pg_isready para que otros servicios puedan depender de el
#
# Uso:
#   1) cp .env.example .env  (y editar valores)
#   2) docker compose up -d
#   3) docker compose logs -f db   # ver init scripts corriendo
#   4) docker compose exec db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB"
# ==============================================================================

services:
  db:
    image: postgres:15-alpine
    container_name: clipsai-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Locale y timezone consistentes para timestamps del dominio
      PGTZ: ${POSTGRES_TZ:-UTC}
      TZ: ${POSTGRES_TZ:-UTC}
    ports:
      # Se expone el puerto configurable en el host, siempre contra el 5432 interno
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Persistencia de datos entre `docker compose down` y `up`
      - postgres_data:/var/lib/postgresql/data
      # Scripts DDL/seed ejecutados UNA sola vez, al inicializar el volumen vacio
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # pg_isready se autentica con el usuario/db reales para evitar falsos positivos
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - clipsai-net

  # ----------------------------------------------------------------------------
  # Backend FastAPI (Issue 3 — autenticacion)
  # ----------------------------------------------------------------------------
  backend_fastapi:
    build:
      context: ./backend_fastapi
      dockerfile: Dockerfile
    container_name: clipsai-backend-fastapi
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      APP_ENV: ${APP_ENV:-development}
      TZ: ${POSTGRES_TZ:-UTC}
    ports:
      - "${BACKEND_FASTAPI_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - clipsai-net

  backend_express:
    build:
      context: ./backend_express
      dockerfile: Dockerfile
    container_name: clipsai-backend-express
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      APP_ENV: ${APP_ENV:-development}
      PORT: ${BACKEND_EXPRESS_PORT:-3001}
      BACKEND_EXPRESS_PORT: ${BACKEND_EXPRESS_PORT:-3001}
      TZ: ${POSTGRES_TZ:-UTC}
    ports:
      - "${BACKEND_EXPRESS_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\" || wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - clipsai-net

volumes:
  postgres_data:
    name: clipsai_postgres_data

networks:
  clipsai-net:
    name: clipsai-net
    driver: bridge
