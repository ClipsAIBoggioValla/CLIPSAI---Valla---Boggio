name: Build and Push Docker Image

on:
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions de GitHub
  push:
    branches:
      - dev   # Se ejecuta automáticamente al hacer push a dev (rama activa)

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./worker.Dockerfile
          push: true
          tags: |
            mfboggio/clipsai-worker:v22
            mfboggio/clipsai-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
